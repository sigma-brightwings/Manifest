# The public site: a landing page in the title card's colours at the root,
# and the game itself, untouched, at /play/.
#
# NOT JEKYLL. GitHub's suggested Pages workflow runs the whole repo through
# Jekyll, and for this repo that is wrong twice over. The game needs no
# build step at all — index.html runs as it stands — and Jekyll would have
# rendered every .md file in the root into a public page: PLAN.md,
# CLAUDE.md, next.md, NEXT-STEPS.md. Those are working notes, not a
# website. So this workflow copies exactly the files the game loads, and
# nothing else reaches the site.
#
# THE STATION GEOMETRY IS STORED PACKED (tools/pack.cjs, 2026-10-30). The
# repo holds src/ports/<id>.js.gz, not the scripts the browser runs, and a
# static host cannot unpack them on the way out. So the runner unpacks them
# here, into the copy that is published, and the .gz files are left out of
# the site. Until 2026-10-30 these lived in Git LFS and every uncached
# deploy pulled ~270 MB against the LFS bandwidth quota; now the checkout
# is the whole of it.

name: pages

on:
  push:
    branches: ["master"]
    # Only redeploy when something the site actually serves has changed.
    # A push that only edits PLAN.md has nothing to publish.
    paths:
      - "index.html"
      - "src/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run already deploying is allowed to finish
# rather than being cancelled half-published.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5 and newer throughout: the v4-era actions run on Node 20, which the
      # runners have deprecated (see the note in build.yml).
      - uses: actions/checkout@v5

      # Unpack the station geometry the browser will ask for.
      - name: Unpack station art
        run: |
          n=0
          for f in src/ports/*.js.gz; do gunzip -kf "$f"; n=$((n+1)); done
          echo "unpacked $n stations"
          # Refuse to publish a site with no stations in it.
          if [ "$n" -lt 1 ]; then echo "::error::No packed station geometry found"; exit 1; fi

      # Assemble the site. The game goes in as-is: index.html plus src/,
      # minus the node-only *.cjs verifiers, which a browser never loads.
      - name: Assemble site
        run: |
          mkdir -p _site/play
          cp -r site/. _site/
          cp index.html _site/play/
          cp -r src _site/play/src
          find _site/play/src -name '*.cjs' -delete
          # The packed copies were unpacked above; the browser never reads them.
          find _site/play/src -name '*.gz' -delete
          # Belt and braces: tells Pages not to run Jekyll on what we upload.
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
