<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Manifest</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #04060c; color: #cfe0ff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  /* Two stacked canvases. #gl draws the world on the GPU; #view draws the
     cockpit, the instruments and every label on top of it in 2D. #view is
     the one that takes input, so it sits above and #gl never receives a
     pointer event. */
  #gl, #view { position: absolute; top: 0; left: 0; display: block; }
  #gl { z-index: 0; pointer-events: none; }
  #view { z-index: 1; touch-action: none; cursor: grab; background: transparent; }
  #view:active { cursor: grabbing; }
  /* The boot card is the title card's first frame: the same sky, the same
     rose and wordmark in the same place, all from logo.js, drawn while the
     rest of the scripts load. It fades rather than vanishing, so it hands
     over to the title screen instead of blinking. */
  #boot {
    position: fixed; inset: 0; background: #020309; z-index: 10;
    transition: opacity 0.7s ease;
  }
  #boot canvas { position: absolute; top: 0; left: 0; display: block; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="view"></canvas>
<div id="boot"><canvas id="bootmark" role="img" aria-label="Manifest, loading"></canvas></div>

<!-- logo.js first of all: it needs nothing else, and the boot card draws
     the rose and the wordmark out of it while everything below loads. -->
<script src="src/logo.js"></script>
<script>
  (function () {
    var c = document.getElementById('bootmark');
    if (!c || !window.Logo) return;
    // main.js reads this: the title card's first showing starts finished,
    // because this card is already showing it.
    window.ManifestBootCard = true;
    var W = window.innerWidth, H = window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    var ctx = c.getContext('2d');
    ctx.scale(dpr, dpr);
    Logo.drawSky(ctx, W, H, performance.now() / 1000);
    var L = Logo.layout(W, H, 520);          // 520 = MENU_W in main.js
    Logo.drawLockup(ctx, L, 1, 1);
    // "loading" where the menu is about to be.
    ctx.font = 'bold 13px ui-monospace, Consolas, monospace';
    ctx.fillStyle = 'rgba(195,195,195,0.8)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('loading…', L.menuX + 260, L.wide ? H / 2 : L.lineY + 60);
  })();
</script>

<!-- Load order matters: each file uses the ones above it.
     These are deliberately plain scripts, not ES modules, so the game runs
     by double-clicking this file with no local web server. -->
<script src="src/release.js"></script>
<script src="src/vec3.js"></script>
<script src="src/rng.js"></script>
<!-- slipspace.js needs nothing but rng, and galaxy.js needs IT — the lane
     timetable and the mass-scaled transit time both have to exist before a
     jump plan can quote a duration. -->
<script src="src/slipspace.js"></script>
<script src="src/kepler.js"></script>
<script src="src/rings.js"></script>
<script src="src/survey.js"></script>
<script src="src/claims.js"></script>
<script src="src/wars.js"></script>
<script src="src/mining.js"></script>
<script src="src/economy.js"></script>
<script src="src/generate.js"></script>
<script src="src/galaxy.js"></script>
<script src="src/sim.js"></script>
<script src="src/combat.js"></script>
<!-- The ships you own and are not sitting in. After combat.js, which
     owns the hulls it describes. -->
<!-- The people aboard. Before fleet.js, which asks whether a parked
     ship has anyone on it. -->
<script src="src/crew.js"></script>
<script src="src/fleet.js"></script>
<script src="src/construction.js"></script>
<script src="src/dressing.js"></script>
<script src="src/walk.js"></script>
<!-- The cargo containers: data generated by tools/cargo-kit.cjs from
     ref/cargo/, built into a hold's mesh by cargokit.js (read by
     shipdeck.js at call time). -->
<script src="src/cargokit-data.js"></script>
<script src="src/cargokit.js"></script>
<script src="src/shipdeck.js"></script>
<script src="src/airlock.js"></script>
<script src="src/tithe.js"></script>
<script src="src/npcmodel.js"></script>
<script src="src/npc.js"></script>
<!-- The face under the helmet, as a composite sketch, for the
     conversation panel. Reads NpcModel at call time. -->
<script src="src/portrait.js"></script>
<!-- The people's bodies (2026-10-26): Quaternius' Universal Base Characters and
     animation library (CC0), and the runtime that poses them and dresses them
     in the old figures' paint and kit. After npcmodel.js and portrait.js. -->
<script src="src/people-data.js"></script>
<script src="src/rig.js"></script>
<script src="src/people.js"></script>
<!-- Industry you own, and what it does to a system. After combat.js, whose
     effectiveCorruption reads it, and after fleet.js, beside which it
     settles at the desk. -->
<script src="src/holdings.js"></script>
<script src="src/missions.js"></script>
<script src="src/arcs.js"></script>
<script src="src/shiptrade.js"></script>
<script src="src/captains.js"></script>
<script src="src/messages.js"></script>
<script src="src/favours.js"></script>
<!-- Other ships' tanks, purses and breakdowns: read by sim.js's
     trafficState and messages.js's tick at call time. -->
<script src="src/upkeep.js"></script>
<!-- The captain's notes and log (F5 NOTES): written to by combat, upkeep,
     favours, tithe and missions at call time; drawn by screens.js. -->
<script src="src/journal.js"></script>
<script src="src/rumours.js"></script>
<!-- Talking to people on foot: reads captains, rumours, favours and
     messages at call time, so after them. -->
<script src="src/dialogue.js"></script>
<script src="src/boarding.js"></script>
<script src="src/eva.js"></script>
<script src="src/arms.js"></script>
<script src="src/licence.js"></script>
<script src="src/stations.js"></script>
<!-- Who hunts whom: NPCs that rob, chase, arrest and skirmish (Phase 9). -->
<script src="src/aggression.js"></script>
<script src="src/hunters.js"></script>
<script src="src/sound.js"></script>
<script src="src/save.js"></script>
<!-- logo.js is loaded at the top, for the boot card. -->
<script src="src/hulls.js"></script>
<!-- Generated from ref/ports by `node tools/glb2hulls.js ref/ports --ports`.
     OPTIONAL by design: delete it and every port falls back to the
     procedural mesh render.js builds. It must load BEFORE render.js, which
     reads global.PortLib when its own library cache is first asked for. -->
<script src="src/ports.js"></script>
<script src="src/hullfit.js"></script>
<!-- Generated by `node tools/port-sites.cjs`: where a city site's town may
     stand, so each port puts it somewhere of its own (2026-10-24). Optional
     like ports.js: without it every city stays where the art left it. -->
<script src="src/port-sites.js"></script>
<script src="src/render.js"></script>
<!-- The weather field, on the CPU. Before gl.js, which reads its own
     shader constants out of it so the picture and the forecast cannot
     drift apart. -->
<script src="src/weather.js"></script>
<script src="src/gl.js"></script>
<script src="src/npcgl.js"></script>
<script src="src/screens.js"></script>
<!-- The captains' stories on the title card. Needs nothing; main.js picks one.
     (captains.js, above, is the captains out in their ships.) -->
<script src="src/captain-stories.js"></script>
<script src="src/main.js"></script>
<!-- The reader model (messages.js). A MODULE, so it runs after every classic
     script above and can find window.Messages; it loads in the background
     and the game reads with the phrase matcher until it is ready, or if
     `npm run models` has not been run. -->
<script type="module" src="src/embedder.js"></script>
<script>
  // Hide the boot card once the first frame has been drawn.
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      var b = document.getElementById('boot');
      if (!b) return;
      b.style.pointerEvents = 'none';
      b.style.opacity = '0';
      setTimeout(function () { b.remove(); window.ManifestBootCard = false; }, 800);
    });
  });
</script>
</body>
</html>
