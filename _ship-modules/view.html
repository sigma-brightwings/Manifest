<!doctype html>
<html><head><meta charset="utf-8"><title>Ship modules</title>
<style>
body{margin:0;background:#0b0f1a;color:#cfd9ee;font:13px ui-monospace,Consolas,monospace;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;padding:8px 12px;background:#0b0f1aee;z-index:2;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
select,input{background:#1d2740;color:#dfe8ff;border:1px solid #3a4a70;font:13px ui-monospace,monospace}
#info{position:fixed;left:12px;bottom:10px;color:#9fb0cc;line-height:1.6}
canvas{display:block}
</style></head><body>
<div id="bar">
 <span>ship <select id="ship"></select></span>
 <span>pull apart <input id="ex" type="range" min="0" max="100" value="45"></span>
 <label><input id="tint" type="checkbox" checked> colour by piece</label>
 <label><input id="joints" type="checkbox" checked> joints</label>
 <span style="color:#9fb0cc">drag to turn &middot; wheel to zoom</span>
</div>
<canvas id="cv"></canvas>
<div id="info"></div>
<script>
var cv = document.getElementById('cv'), x = cv.getContext('2d');
var S = null, yaw = 0.9, pitch = 0.45, zoom = 1, hover = null;
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; draw(); }
addEventListener('resize', size);
fetch('index.json').then(function (r) { return r.json(); }).then(function (idx) {
  var sel = document.getElementById('ship');
  idx.forEach(function (s) { var o = document.createElement('option'); o.value = s.ship; o.textContent = s.ship + '  (' + s.pieces + ' pieces)'; sel.appendChild(o); });
  sel.onchange = function () { load(sel.value); };
  var first = 'fighter-m'; sel.value = first; load(first);
});
function load(name) {
  fetch(name + '.json').then(function (r) { return r.json(); }).then(function (d) {
    S = d;
    var lo = d.bounds.lo, hi = d.bounds.hi;
    S.mid = [0, 1, 2].map(function (a) { return (lo[a] + hi[a]) / 2; });
    S.rad = Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]);
    S.pieces.forEach(function (p, i) {
      p.ctr = [0, 1, 2].map(function (a) { return (p.lo[a] + p.hi[a]) / 2; });
      p.hue = (i * 137.508) % 360;
      p.tris = [];
      for (var k = 0; k < p.v.length; k += 9) p.tris.push({ a: [p.v[k], p.v[k + 1], p.v[k + 2]], b: [p.v[k + 3], p.v[k + 4], p.v[k + 5]], c: [p.v[k + 6], p.v[k + 7], p.v[k + 8]], col: p.c[k / 9] });
    });
    zoom = 1; size();
  });
}
['ex', 'tint', 'joints'].forEach(function (id) { document.getElementById(id).oninput = draw; });
var drag = null;
cv.onmousedown = function (e) { drag = [e.clientX, e.clientY, yaw, pitch]; };
addEventListener('mouseup', function () { drag = null; });
addEventListener('mousemove', function (e) {
  if (drag) { yaw = drag[2] + (e.clientX - drag[0]) * 0.008; pitch = Math.max(-1.5, Math.min(1.5, drag[3] + (e.clientY - drag[1]) * 0.008)); draw(); }
  else { pick(e.clientX * devicePixelRatio, e.clientY * devicePixelRatio); }
});
cv.onwheel = function (e) { e.preventDefault(); zoom *= e.deltaY < 0 ? 1.1 : 1 / 1.1; draw(); };

/* Exploded position: each piece moves out from the ship's centre along the
 * line to its own centre, so neighbours separate at their joints. */
function off(p) {
  var k = document.getElementById('ex').value / 100 * 0.9;
  return [0, 1, 2].map(function (a) { return (p.ctr[a] - S.mid[a]) * k; });
}
function proj(v, o) {
  var X = v[0] + o[0] - S.mid[0], Y = v[1] + o[1] - S.mid[1], Z = v[2] + o[2] - S.mid[2];
  var cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  var x1 = X * cy - Z * sy, z1 = X * sy + Z * cy;
  var y2 = Y * cp - z1 * sp, z2 = Y * sp + z1 * cp;
  var sc = Math.min(cv.width, cv.height) * 0.62 / S.rad * zoom;
  return [cv.width / 2 + x1 * sc, cv.height / 2 - y2 * sc, z2];
}
var LIGHT = (function () { var l = [0.4, 0.8, 0.45], n = Math.hypot(l[0], l[1], l[2]); return l.map(function (v) { return v / n; }); })();
var drawn = [];
function draw() {
  if (!S) return;
  x.fillStyle = '#0b0f1a'; x.fillRect(0, 0, cv.width, cv.height);
  var tint = document.getElementById('tint').checked, list = [];
  S.pieces.forEach(function (p) {
    var o = off(p);
    p.tris.forEach(function (t) {
      var A = proj(t.a, o), B = proj(t.b, o), C = proj(t.c, o);
      var u = [t.b[0] - t.a[0], t.b[1] - t.a[1], t.b[2] - t.a[2]], w = [t.c[0] - t.a[0], t.c[1] - t.a[1], t.c[2] - t.a[2]];
      var nx = u[1] * w[2] - u[2] * w[1], ny = u[2] * w[0] - u[0] * w[2], nz = u[0] * w[1] - u[1] * w[0], nl = Math.hypot(nx, ny, nz) || 1;
      var lit = 0.35 + 0.65 * Math.abs((nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]) / nl);
      list.push({ A: A, B: B, C: C, z: (A[2] + B[2] + C[2]) / 3, p: p, lit: lit, col: t.col });
    });
  });
  list.sort(function (a, b) { return a.z - b.z; });
  list.forEach(function (q) {
    var base;
    if (tint) base = 'hsl(' + q.p.hue + ',55%,' + Math.round(22 + 40 * q.lit) + '%)';
    else { var h = S.colours[q.col] || '#888888'; base = shade(h, q.lit); }
    if (hover === q.p) base = 'hsl(50,95%,' + Math.round(40 + 30 * q.lit) + '%)';
    x.fillStyle = base; x.strokeStyle = base; x.lineWidth = 0.6;
    x.beginPath(); x.moveTo(q.A[0], q.A[1]); x.lineTo(q.B[0], q.B[1]); x.lineTo(q.C[0], q.C[1]); x.closePath(); x.fill(); x.stroke();
  });
  drawn = list;
  if (document.getElementById('joints').checked) {
    x.strokeStyle = 'rgba(255,255,255,0.35)'; x.lineWidth = 1 * devicePixelRatio;
    var byId = {}; S.pieces.forEach(function (p) { byId[p.id] = p; });
    S.joints.forEach(function (j) {
      var a = byId[j.a], b = byId[j.b]; if (!a || !b) return;
      var A = proj(a.ctr, off(a)), B = proj(b.ctr, off(b));
      x.beginPath(); x.moveTo(A[0], A[1]); x.lineTo(B[0], B[1]); x.stroke();
    });
  }
  var roles = {}; S.pieces.forEach(function (p) { roles[p.role] = (roles[p.role] || 0) + 1; });
  document.getElementById('info').innerHTML = S.ship + ' &middot; ' + S.pieces.length + ' pieces (' +
    Object.keys(roles).map(function (k) { return roles[k] + ' ' + k; }).join(', ') + ') &middot; ' + S.joints.length + ' joints' +
    (hover ? '<br>piece ' + hover.id + ' &middot; ' + hover.role + ' &middot; ' + hover.tris.length + ' triangles' : '');
}
function shade(hex, k) {
  var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  var f = 0.5 + 1.1 * k;
  return 'rgb(' + Math.min(255, Math.round(r * f + 18)) + ',' + Math.min(255, Math.round(g * f + 18)) + ',' + Math.min(255, Math.round(b * f + 18)) + ')';
}
function pick(px, py) {
  var found = null;
  for (var i = drawn.length - 1; i >= 0; i--) { var q = drawn[i]; if (inTri(px, py, q.A, q.B, q.C)) { found = q.p; break; } }
  if (found !== hover) { hover = found; draw(); }
}
function inTri(px, py, a, b, c) {
  var d1 = (px - b[0]) * (a[1] - b[1]) - (a[0] - b[0]) * (py - b[1]);
  var d2 = (px - c[0]) * (b[1] - c[1]) - (b[0] - c[0]) * (py - c[1]);
  var d3 = (px - a[0]) * (c[1] - a[1]) - (c[0] - a[0]) * (py - a[1]);
  return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
}
</script></body></html>
